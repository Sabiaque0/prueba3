<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor IPTV</title>
  <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; padding: 15px; }
    h2 { margin-bottom: 15px; text-align: center; color: #00adb5; }
    
    .input-section { margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
    input[type="text"] { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #333; background: #222; color: #fff; }
    button { padding: 10px; border: none; background-color: #00adb5; color: white; font-weight: bold; border-radius: 5px; cursor: pointer; }
    button:active { background-color: #00787d; }

    .player-container { margin-bottom: 15px; width: 100%; height: 210px; background: #000; border-radius: 8px; overflow: hidden; }
    .video-js { width: 100%; height: 100%; }

    .status-msg { text-align: center; color: #ffb703; font-size: 14px; margin-bottom: 10px; display: none; }

    .channel-list { max-height: 350px; overflow-y: auto; background: #1e1e1e; border-radius: 8px; padding: 5px; }
    .channel-item { padding: 12px; border-bottom: 1px solid #2a2a2a; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .channel-item:hover { background: #333; }
    .channel-item:last-child { border-bottom: none; }
    .channel-name { font-size: 14px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Reproductor IPTV</h2>

  <div class="input-section">
    <input type="text" id="m3uUrl" placeholder="Pega la URL de la lista .m3u / .m3u8">
    <button onclick="loadList()">Cargar Canales</button>
  </div>

  <div id="status" class="status-msg">Cargando lista...</div>

  <div class="player-container">
    <video id="iptvPlayer" class="video-js vjs-default-skin" controls preload="auto"></video>
  </div>

  <div class="channel-list" id="channelList">
    <div style="padding: 15px; text-align: center; color: #888;">Introduce una URL m3u para desglosar los canales.</div>
  </div>

  <script>
    let player = videojs('iptvPlayer');

    async function fetchWithFallback(url) {
      const statusEl = document.getElementById('status');
      
      // Intento 1: Descarga directa
      try {
        statusEl.innerText = "Intentando descarga directa...";
        statusEl.style.display = "block";
        const res = await fetch(url);
        if (res.ok) return await res.text();
      } catch (e) {
        console.warn("Fallo descarga directa, intentando con proxy CORS...");
      }

      // Intento 2: Proxy CORS (corsproxy.io)
      try {
        statusEl.innerText = "Cargando mediante Proxy CORS...";
        const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(url);
        const res = await fetch(proxyUrl);
        if (res.ok) return await res.text();
      } catch (e) {
        console.warn("Fallo proxy 1, intentando proxy secundario...");
      }

      // Intento 3: Proxy secundario (allorigins)
      try {
        statusEl.innerText = "Cargando mediante Proxy secundario...";
        const proxyUrl2 = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
        const res = await fetch(proxyUrl2);
        if (res.ok) return await res.text();
      } catch (e) {
        throw new Error("No se pudo obtener la lista con ningún método.");
      }
    }

    async function loadList() {
      const rawUrl = document.getElementById('m3uUrl').value.trim();
      const statusEl = document.getElementById('status');

      if (!rawUrl) {
        alert("Introduce una URL M3U válida.");
        return;
      }

      try {
        const textData = await fetchWithFallback(rawUrl);
        statusEl.style.display = "none";
        parseM3U(textData);
      } catch (err) {
        statusEl.style.display = "none";
        alert("Error al cargar la lista. Verifica la URL o que el enlace no requiera usuario/contraseña bloqueado.");
        console.error(err);
      }
    }

    function parseM3U(m3uContent) {
      const lines = m3uContent.split(/\r?\n/);
      const channels = [];
      let currentName = null;

      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const commaIdx = line.indexOf(',');
          if (commaIdx !== -1) {
            currentName = line.substring(commaIdx + 1).trim();
          } else {
            currentName = "Canal sin nombre";
          }
        } else if (line && !line.startsWith('#')) {
          if (currentName) {
            channels.push({ name: currentName, url: line });
            currentName = null;
          }
        }
      });

      renderChannels(channels);
    }

    function renderChannels(channels) {
      const listContainer = document.getElementById('channelList');
      listContainer.innerHTML = '';

      if (channels.length === 0) {
        listContainer.innerHTML = '<div style="padding: 15px; text-align: center;">No se encontraron canales en el archivo.</div>';
        return;
      }

      channels.forEach(channel => {
        const item = document.createElement('div');
        item.className = 'channel-item';
        item.innerHTML = `<span class="channel-name">${channel.name}</span>`;
        item.onclick = () => playChannel(channel.url);
        listContainer.appendChild(item);
      });
    }

    function playChannel(url) {
      player.src({
        src: url,
        type: 'application/x-mpegURL'
      });
      player.play().catch(e => {
        alert("No se pudo reproducir este canal. Es posible que la señal esté caída o use un protocolo no compatible.");
      });
    }
  </script>
</body>
</html>
